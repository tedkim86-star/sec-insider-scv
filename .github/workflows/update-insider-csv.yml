name: Update SEC insider CSV

on:
  workflow_dispatch:
  schedule:
    - cron: "10 0 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  USER_AGENT: "isispat-insider-tracker bjkim@isispat.com"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set SINCE_DATE to today in KST
        run: |
          echo "SINCE_DATE=$(TZ=Asia/Seoul date +%F)" >> $GITHUB_ENV
          echo "Using SINCE_DATE=$(TZ=Asia/Seoul date +%F)"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build insider CSV
        run: python scripts/build_insider_csv.py

      - name: Commit updated CSV files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/*.csv
          git commit -m "Update insider CSV" || echo "No changes to commit"
          git push
