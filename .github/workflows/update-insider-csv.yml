name: Update SEC insider CSV

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "최근 며칠치 데이터를 조회할지 입력"
        required: true
        default: "7"
      run_label:
        description: "파일명에 붙일 라벨. 비워두면 오늘 날짜 사용"
        required: false
        default: ""
  schedule:
    - cron: "10 0 * * *"

env:
  USER_AGENT: "isispat-insider-tracker bjkim@isispat.com"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set RUN_DATE and SINCE_DATE in KST
        run: |
          RUN_DATE=$(TZ=Asia/Seoul date +%F)

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LOOKBACK_DAYS="${{ github.event.inputs.lookback_days }}"
            RUN_LABEL="${{ github.event.inputs.run_label }}"
          else
            LOOKBACK_DAYS="7"
            RUN_LABEL=""
          fi

          if ! [[ "$LOOKBACK_DAYS" =~ ^[0-9]+$ ]]; then
            echo "lookback_days must be a non-negative integer."
            exit 1
          fi

          if [ "$LOOKBACK_DAYS" = "0" ]; then
            SINCE_DATE="$RUN_DATE"
          else
            SINCE_DATE=$(TZ=Asia/Seoul date -d "${LOOKBACK_DAYS} days ago" +%F)
          fi

          if [ -z "$RUN_LABEL" ]; then
            RUN_LABEL="$RUN_DATE"
          fi

          echo "RUN_DATE=$RUN_DATE" >> $GITHUB_ENV
          echo "SINCE_DATE=$SINCE_DATE" >> $GITHUB_ENV
          echo "LOOKBACK_DAYS=$LOOKBACK_DAYS" >> $GITHUB_ENV
          echo "RUN_LABEL=$RUN_LABEL" >> $GITHUB_ENV

          echo "RUN_DATE=$RUN_DATE"
          echo "SINCE_DATE=$SINCE_DATE"
          echo "LOOKBACK_DAYS=$LOOKBACK_DAYS"
          echo "RUN_LABEL=$RUN_LABEL"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build insider CSV
        run: python scripts/build_insider_csv.py

      - name: Save daily CSV copy
        run: |
          mkdir -p data/daily
          cp data/insider_raw_data.csv "data/daily/${RUN_LABEL}_lookback_${LOOKBACK_DAYS}d_insider_raw_data.csv"
          cp data/insider_raw_data.csv data/insider_raw_data_latest.csv

      - name: Commit updated CSV files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/*.csv data/daily/*.csv
          git commit -m "Update insider CSV for ${RUN_LABEL}, lookback ${LOOKBACK_DAYS}d" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
